name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    container: debian:sid
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake \
            extra-cmake-modules \
            g++ \
            gettext \
            make \
            libkf6i18n-dev \
            libkf6texteditor-dev \
            qt6-base-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Stage artifact
        run: |
          cmake --install build --prefix staging
          cp packaging/README-linux.txt staging/README.txt
          cp -r LICENSES staging/LICENSES

      - name: Create archive
        run: |
          VERSION=${GITHUB_REF_NAME}
          tar czf docker-plugin-${VERSION}-linux-x86_64.tar.gz -C staging .

      - name: Generate checksum
        run: sha256sum docker-plugin-*-linux-*.tar.gz > checksums-linux.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            docker-plugin-*-linux-*.tar.gz
            checksums-linux.txt

  publish:
    name: Publish Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/docker-plugin-*.tar.gz
            artifacts/checksums-*.txt
