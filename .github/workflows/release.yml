name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    container:
      image: kdeneon/plasma:unstable
      options: --user 0
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            extra-cmake-modules \
            g++ \
            gettext \
            libkf6i18n-dev \
            libkf6texteditor-dev \
            qt6-base-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Stage artifact
        run: |
          cmake --install build --prefix staging
          cp packaging/README-linux.txt staging/README.txt
          cp -r LICENSES staging/LICENSES

      - name: Create archive
        run: |
          VERSION=${GITHUB_REF_NAME}
          tar czf docker-plugin-${VERSION}-linux-x86_64.tar.gz -C staging .

      - name: Generate checksum
        run: sha256sum docker-plugin-*-linux-*.tar.gz > checksums-linux.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            docker-plugin-*-linux-*.tar.gz
            checksums-linux.txt

  build-windows:
    name: Build (Windows, experimental)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-extra-cmake-modules
            mingw-w64-x86_64-ki18n
            mingw-w64-x86_64-ktexteditor
            mingw-w64-x86_64-qt6-base
            make
            zip

      - name: Configure
        run: cmake -B build -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Stage artifact
        run: |
          cmake --install build --prefix staging
          cp packaging/README-windows.txt staging/README.txt
          cp -r LICENSES staging/LICENSES

      - name: Create archive
        run: |
          VERSION=${GITHUB_REF_NAME}
          cd staging
          zip -r ../docker-plugin-${VERSION}-windows-x86_64.zip .

      - name: Generate checksum
        run: sha256sum docker-plugin-*-windows-*.zip > checksums-windows.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            docker-plugin-*-windows-*.zip
            checksums-windows.txt

  publish:
    name: Publish Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: artifacts/

      - name: Download Windows artifacts (if available)
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: artifacts/
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/docker-plugin-*.tar.gz
            artifacts/docker-plugin-*.zip
            artifacts/checksums-*.txt
