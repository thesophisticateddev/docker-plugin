name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    container: debian:sid
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake \
            extra-cmake-modules \
            g++ \
            gettext \
            libkf6i18n-dev \
            libkf6texteditor-dev \
            qt6-base-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Stage install
        run: cmake --install build --prefix build/staging

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-plugin-linux-x86_64
          path: build/staging/

  build-windows:
    name: Build (Windows, experimental)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Craft and KF6 dependencies
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/KDE/craft/master/setup/install_craft.ps1" -OutFile install_craft.ps1
          & .\install_craft.ps1 --prefix C:\CraftRoot --non-interactive
          C:\CraftRoot\craft\craftenv.ps1
          craft extra-cmake-modules ki18n ktexteditor

      - name: Configure
        shell: pwsh
        run: |
          C:\CraftRoot\craft\craftenv.ps1
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=C:\CraftRoot

      - name: Build
        shell: pwsh
        run: |
          C:\CraftRoot\craft\craftenv.ps1
          cmake --build build --parallel

      - name: Stage install
        shell: pwsh
        run: |
          C:\CraftRoot\craft\craftenv.ps1
          cmake --install build --prefix build/staging

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-plugin-windows-x86_64
          path: build/staging/
